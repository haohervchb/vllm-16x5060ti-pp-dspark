# Safe baseline for aikitoria's patched NVIDIA 610.43.02 driver.
#
# That patch already hard-codes ForceP2P=0x11, selects the PCIe BAR1 path, and
# enables the GH100/Blackwell BAR1 mapping implementation.  Do not duplicate
# unrelated experimental registry profiles here: 610.43.02 rejects at least
# one of those extra keys during GSP initialization with
# NV_ERR_INVALID_REGISTRY_KEY.  The remaining prerequisite is a full-size BAR1
# aperture allocated by firmware/PCI resource assignment.
options nvidia NVreg_EnableResizableBar=1
